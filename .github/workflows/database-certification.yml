name: database-certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-h3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - run: pnpm acceptance:database
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-certification-evidence
          path: output/acceptance/database/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
