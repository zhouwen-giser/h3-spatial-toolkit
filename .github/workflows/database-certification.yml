name: database-certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-h3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      ALLOW_DATABASE_CERTIFICATION_RESET: "YES"
      DATABASE_CERTIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - run: pnpm acceptance:database
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-certification-evidence
          path: output/acceptance/database/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
