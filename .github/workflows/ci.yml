name: local-quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm environment:report -- --write
      - run: pnpm acceptance:local
      - run: pnpm acceptance:api
      - if: matrix.node == 24
        run: pnpm benchmark
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-quality-node-${{ matrix.node }}
          path: |
            coverage/coverage-summary.json
            apps/api/openapi.json
            sbom/cyclonedx-bom.json
            THIRD_PARTY_NOTICES.md
          if-no-files-found: warn
          retention-days: 14
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-node-24
          path: benchmark/results/latest.json
          if-no-files-found: error
          retention-days: 14

  source-package:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: release/
          if-no-files-found: error
          retention-days: 14
